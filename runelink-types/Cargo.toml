[package]
name = "runelink-types"
version = "0.5.5"
edition = "2024"
repository.workspace = true

[features]
default = []
sqlx = [ "dep:sqlx" ]

[dependencies]
base64 = "0.23.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "uuid",
    "time"
], optional = true }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
