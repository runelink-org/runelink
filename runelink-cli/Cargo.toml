[package]
name = "runelink-cli"
version = "0.5.6"
edition = "2024"
repository.workspace = true

[[bin]]
name = "rune"
path = "src/main.rs"

[dependencies]
runelink-client = { path = "../runelink-client" }
runelink-types = { path = "../runelink-types" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
directories = "6.0.0"
crossterm = "0.29.0"
rpassword = "7.5.4"
log = "0.4.34"
env_logger = "0.11.11"
unicode-width = "0.2.3"
unicode-segmentation = "1.13.3"
