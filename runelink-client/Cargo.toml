[package]
name = "runelink-client"
version = "0.5.5"
edition = "2024"
repository.workspace = true

[dependencies]
runelink-types = { path = "../runelink-types" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
log = "0.4.34"
